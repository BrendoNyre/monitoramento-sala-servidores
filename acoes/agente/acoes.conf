# =====================================================================
# acoes.conf — o que o agente Zabbix PODE executar a pedido do servidor
# ---------------------------------------------------------------------
# Por padrão o agente 2 recusa qualquer comando (system.run). Aqui
# liberamos EXATAMENTE dois arquivos, sem curinga: um "*" deixaria passar
# "/opt/acoes/x.sh; rm -rf /", porque o comando roda num shell.
#
# A ordem importa: o agente testa as regras de cima para baixo. As duas
# liberações vêm antes do "nega todo o resto".
#
# O mesmo nome de arquivo existe em cada servidor, mas o CONTEÚDO muda:
#   SRV-02 (Docker)  → acoes/agente/srv02/   (fala com a API do Docker)
#   SRV-01 (celular) → acoes/agente/srv01/   (fala com o gunicorn e o vigia)
# Na nuvem seria a mesma ideia: o script chamaria AWS SSM, Azure Run
# Command, OCI... e o botão da central continuaria igual.
# =====================================================================
AllowKey=system.run[/opt/acoes/reiniciar-app.sh]
AllowKey=system.run[/opt/acoes/encerrar-ociosas.sh]
DenyKey=system.run[*]
