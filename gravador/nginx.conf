# Configuração do nginx do gravador.
# Por que existe: a configuração padrão serviria os arquivos, mas deixaria o
# navegador guardar o .bin em cache. Depois de recompilar, você poderia
# gravar o firmware ANTIGO sem perceber. Aqui proibimos esse cache.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Binário e ficha do firmware: sempre buscar do servidor.
    location /firmware/ {
        add_header Cache-Control "no-store" always;
        types {
            application/octet-stream bin;
            application/json         json;
        }
    }

    # A página também: assim uma versão nova aparece sem Ctrl+F5.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
