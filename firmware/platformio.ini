; =====================================================================
; platformio.ini — "receita" de compilação do firmware do ESP32
; ---------------------------------------------------------------------
; O PlatformIO lê este arquivo para saber: qual placa, qual "framework"
; (aqui o Arduino) e quais bibliotecas baixar. Você não precisa instalar
; nada no seu PC: quem compila é o container do gravador (Dockerfile em
; gravador/), sempre com as mesmas versões.
; =====================================================================

[env:esp32dev]
; Versão da plataforma FIXADA. A série 6.x usa o Arduino core 2.x, que é
; maduro e casa com o esptool < 5 usado na mesclagem. As séries 7/8 trocam o
; núcleo e são muito recentes; fixar evita que uma atualização quebre a
; compilação sem ninguém ter mexido no código.
platform  = espressif32@6.13.0

; "esp32dev" é o perfil genérico do ESP32-WROOM-32 (o NodeMCU DevKit V1).
board     = esp32dev
framework = arduino

; Velocidade do Monitor Serial. Precisa ser igual ao Serial.begin() do código
; e ao que a página do gravador usa (115200).
monitor_speed = 115200

; Bibliotecas de terceiros (as de Wi-Fi, WebServer, DNS e mDNS já vêm com o
; Arduino do ESP32). Versões fixadas pelo mesmo motivo acima.
lib_deps =
    bblanchon/ArduinoJson@7.4.3              ; monta o JSON do /status
    adafruit/DHT sensor library@1.4.7         ; conversa com o DHT11
    adafruit/Adafruit Unified Sensor@1.1.15   ; dependência da biblioteca DHT

; Tabela de partições "min_spiffs": duas áreas de programa com 1,9 MB cada. O
; OTA escreve a versão nova na área livre e só troca depois de conferir que ela
; chegou inteira. Por isso, uma falha no meio não derruba a versão em uso.
; Atenção: trocar a tabela exige uma gravação pelo cabo. A tabela antiga não
; tinha a segunda área, e o OTA não consegue reescrever a própria tabela.
board_build.partitions = min_spiffs.csv

; Só mostra erros do núcleo no Serial, para a nossa linha de leitura ficar limpa.
build_flags =
    -DCORE_DEBUG_LEVEL=1

; ---------------------------------------------------------------------
; Atualização pela rede a partir do PC, sem abrir o navegador. Precisa do
; PlatformIO instalado no PC (o container não enxerga a placa pela rede):
;   $env:ESP32_OTA_SENHA = "a senha definida na página do ESP32"
;   pio run -e ota -t upload
; A senha vem de uma variável do terminal para nunca ficar salva neste arquivo.
; ---------------------------------------------------------------------
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = sala-servidor.local
upload_flags =
    --port=3232
    --auth=${sysenv.ESP32_OTA_SENHA}
