# nginx na frente da Loja do SRV-02 ("proxy reverso"): é ele que recebe os
# clientes e repassa para a API. Na vida real faz HTTPS, cache, limita abuso
# e distribui carga entre várias cópias da API.
server {
    listen 80;

    location / {
        proxy_pass http://loja2-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    # Contadores do próprio nginx (conexões, requisições) para o Zabbix.
    location = /nginx_status {
        stub_status;
        access_log off;
    }
}
